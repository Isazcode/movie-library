<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isaz's Movie Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a theater marquee header over a single searchable A–Z shelf, tabs for Movies / TV / Specials */
:root{
  --bg:#eef0f4; --surface:#ffffff; --fg:#1b2030; --muted:#5d6478; --line:#d7dbe4;
  --accent:#c2410c; --accent-soft:#fde7d9; --marquee:#1b2030; --marquee-fg:#fff4e6; --bulb:#f5b544;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1f2b; --fg:#e9ebf1; --muted:#9aa1b4; --line:#2b3242;
  --accent:#fb923c; --accent-soft:#3a2416; --marquee:#0b0d13; --marquee-fg:#fff4e6; --bulb:#f5b544; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2b; --fg:#e9ebf1; --muted:#9aa1b4; --line:#2b3242;
  --accent:#fb923c; --accent-soft:#3a2416; --marquee:#0b0d13; --marquee-fg:#fff4e6; --bulb:#f5b544; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.marquee{background:var(--marquee);color:var(--marquee-fg);position:relative}
header.marquee::before,header.marquee::after{content:"";position:absolute;left:0;right:0;height:6px;
  background:radial-gradient(circle,var(--bulb) 2px,transparent 2.6px) 0 50%/16px 6px repeat-x}
header.marquee::before{top:6px} header.marquee::after{bottom:6px}
header .wrap{padding-block:34px 30px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bulb);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:14px;color:color-mix(in srgb,var(--marquee-fg) 75%,transparent)}
.stats b{font-family:var(--display);font-size:24px;color:var(--marquee-fg);font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{font:600 14px var(--body);border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tabs button:focus-visible,#q:focus-visible,.az a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs .n{font-weight:500;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
#q{flex:1 1 220px;min-width:0;font:15px var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.az{display:flex;flex-wrap:wrap;gap:2px;width:100%}
.az a{font:600 12px var(--body);color:var(--muted);text-decoration:none;padding:3px 6px;border-radius:4px}
.az a:hover{background:var(--accent-soft);color:var(--accent)}
.az a.off{opacity:.3;pointer-events:none}
main .wrap{padding-block:18px 60px}
.group{display:grid;grid-template-columns:56px 1fr;gap:0 16px;padding-block:14px;border-top:1px solid var(--line);scroll-margin-top:130px}
.group:first-child{border-top:0}
.letter{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent)}
ul{list-style:none;margin:0;padding:0;columns:3 260px;column-gap:28px;min-width:0}
li{break-inside:avoid;padding:4px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
li .t{min-width:0}
li .y{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);padding:30px 0}
footer{color:var(--muted);font-size:13px;padding-block:0 30px}
@media (max-width:520px){.group{grid-template-columns:1fr}.letter{font-size:30px;margin-bottom:4px}}

.recent{background:var(--surface);border-bottom:1px solid var(--line)}
.recent .wrap{padding-block:22px 24px;display:flex;flex-direction:column;gap:14px}
.recent-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.recent h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.recent-sub{font-size:13px;color:var(--muted)}
.shelf{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ticket{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 16px 14px 18px;border-radius:10px;background:var(--bg);border:1px solid var(--line);min-width:0}
.ticket::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.ticket .tt{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ticket .tm{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.new{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.soon-row .sm{display:block;font-size:12px;color:var(--muted)}
.chip{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:2px}
#tab-soon[aria-selected="false"]{color:var(--accent)}
.soon-note{margin:18px 0 0;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.hdr-btn{align-self:flex-start;margin-top:14px;display:inline-block;font:600 15px var(--body);text-decoration:none;color:var(--marquee);background:var(--bulb);padding:10px 18px;border-radius:999px}
.hdr-btn:hover{filter:brightness(1.08)}
.hdr-btn:focus-visible{outline:2px solid var(--marquee-fg);outline-offset:3px}
</style>
</head>
<body style="margin:0">

<header class="marquee"><div class="wrap">
  <div class="eyebrow">Now showing</div>
  <h1>Isaz's Movie Library</h1>
  <div class="stats" id="stats"></div>
  <a class="hdr-btn" href="requests.html">Request a movie or show →</a>
</div></header>

<section class="recent" aria-labelledby="recent-h"><div class="wrap">
  <div class="recent-head"><h2 id="recent-h">Recently added</h2><span class="recent-sub" id="recent-sub"></span></div>
  <ol class="shelf" id="shelf"></ol>
</div></section>

<div class="bar"><div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-movies" data-k="movies" aria-selected="true">Movies<span class="n"></span></button>
    <button role="tab" id="tab-shows" data-k="shows" aria-selected="false">TV Shows<span class="n"></span></button>
    <button role="tab" id="tab-soon" data-k="soon" aria-selected="false">Coming soon<span class="n"></span></button>
  </div>
  <input id="q" type="search" placeholder="Search titles or a year, e.g. 2024" aria-label="Search the library">
  <nav class="az" id="az" aria-label="Jump to letter"></nav>
</div></div>

<main><div class="wrap"><p class="soon-note" id="soon-note" hidden>Titles Isaz is working on getting. Not in Plex yet — no need to request these.</p><div id="list"></div></div></main>
<footer><div class="wrap">Ask me if you want to borrow something, or <a href="requests.html" style="color:var(--accent);font-weight:600">request a movie or show</a>.</div></footer>

const labels={movies:'Movies',shows:'TV Shows',soon:'Coming soon'};
let cur='movies';
try{const h=location.hash.slice(1); if(LIB[h]) cur=h;}catch(e){}
const strip=t=>t.replace(/^(the|a|an)\s+/i,'');
const letterOf=t=>{const c=strip(t)[0].toUpperCase(); return /[A-Z]/.test(c)?c:'#';};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RECENT = [{"t": "Fall 2: Deadpoint", "y": 2026, "k": "movie", "d": "2026-10-27"}, {"t": "Verity", "y": 2026, "k": "movie", "d": "2026-10-27"}, {"t": "PAW Patrol: The Dino Movie", "y": 2026, "k": "movie", "d": "2026-10-27"}, {"t": "Tad and The Magic Lamp", "y": 2026, "k": "movie", "d": "2026-10-27"}, {"t": "Forgotten Island", "y": 2026, "k": "movie", "d": "2026-10-27"}, {"t": "Matchbox: The Movie", "y": 2026, "k": "movie", "d": "2026-10-27"}, {"t": "Blade", "y": 1998, "k": "movie", "d": "2026-11-05"}, {"t": "Blade II", "y": 2002, "k": "movie", "d": "2026-11-05"}, {"t": "Blade: Trinity", "y": 2004, "k": "movie", "d": "2026-11-05"}, {"t": "Daredevil", "y": 2003, "k": "movie", "d": "2026-11-05"}, {"t": "Elektra", "y": 2005, "k": "movie", "d": "2026-11-05"}, {"t": "Marvel's Cloak & Dagger", "y": 2018, "k": "show", "d": "2026-11-05"}];
const NEW_DAYS = 30;
const recentKeys = new Set(RECENT.filter(r=>(Date.now()-new Date(r.d+'T12:00:00'))/864e5<=NEW_DAYS).map(r=>r.t.toLowerCase()+'|'+r.y));
const recentShowTitles = new Set(RECENT.filter(r=>r.k==='show'&&(Date.now()-new Date(r.d+'T12:00:00'))/864e5<=NEW_DAYS).map(r=>r.t.toLowerCase()));
(function renderRecent(){
  const items=[...RECENT].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,12);
  const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  document.getElementById('shelf').innerHTML=items.map(r=>`<li class="ticket"><span class="tt">${esc(r.t)}</span><span class="tm"><span>${r.k==='show'?'TV · ':''}${r.y??''}</span><span>Added ${fmt(r.d)}</span></span></li>`).join('');
  document.getElementById('recent-sub').textContent=items.length+' new title'+(items.length===1?'':'s')+' · newest first';
})();
document.getElementById('stats').innerHTML=
  `<span><b>${LIB.movies.length}</b>movies</span><span><b>${LIB.shows.length}</b>TV shows</span><span><b>${LIB.soon.length}</b>coming soon</span>`;
document.querySelectorAll('.tabs button').forEach(b=>{
  b.querySelector('.n').textContent=LIB[b.dataset.k].length;
  b.onclick=()=>{cur=b.dataset.k;render();};
});
const q=document.getElementById('q'); q.oninput=render;
function row(r){
  const [t,y,k,note,tag]=r;
  if(cur==='soon'){
    const kind=k==='show'?'TV':k==='special'?'Special':'';
    const meta=[kind,note].filter(Boolean).join(' · ');
    return `<li class="soon-row"><span class="t">${esc(t)}${tag?`<span class="chip">${esc(tag)}</span>`:''}${meta?`<span class="sm">${esc(meta)}</span>`:''}</span><span class="y">${y??''}</span></li>`;
  }
  const isNew=recentKeys.has(t.toLowerCase()+'|'+y)||(cur==='shows'&&recentShowTitles.has(t.toLowerCase()));
  return `<li><span class="t">${esc(t)}${isNew?'<span class="new">New</span>':''}</span><span class="y">${y??''}</span></li>`;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===cur));
  const term=q.value.trim().toLowerCase();
  const rows=LIB[cur].filter(([t,y])=>!term||(t+' '+(y??'')).toLowerCase().includes(term));
  const groups={};
  rows.forEach(r=>{(groups[letterOf(r[0])]??=[]).push(r);});
  const letters=Object.keys(groups).sort((a,b)=>a==='#'?-1:b==='#'?1:a.localeCompare(b));
  const all=['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  document.getElementById('az').innerHTML=all.map(l=>`<a href="#L-${l==='#'?'0':l}" class="${groups[l]?'':'off'}" data-l="${l}">${l}</a>`).join('');
  document.querySelectorAll('#az a').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));el&&el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
  const list=document.getElementById('list');
  document.getElementById('soon-note').hidden=cur!=='soon';
  if(!rows.length){list.innerHTML=`<p class="empty">Nothing in ${labels[cur]} matches “${esc(q.value)}”.</p>`;return;}
  list.innerHTML=letters.map(l=>`<section class="group" id="L-${l==='#'?'0':l}"><div class="letter">${l}</div><ul>${
    groups[l].map(r=>row(r)).join('')}</ul></section>`).join('');
}
render();
