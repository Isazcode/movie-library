<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Movie Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: marquee header, a box-office request window, the request queue, then the full A–Z library */
:root{
  --bg:#eef0f4; --surface:#ffffff; --fg:#1b2030; --muted:#5d6478; --line:#d7dbe4;
  --accent:#c2410c; --accent-soft:#fde7d9; --marquee:#1b2030; --marquee-fg:#fff4e6; --bulb:#f5b544;
  --ok:#15803d; --ok-soft:#dcfce7; --info:#1d4ed8; --info-soft:#dbeafe; --bad:#b91c1c; --bad-soft:#fee2e2;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1f2b; --fg:#e9ebf1; --muted:#9aa1b4; --line:#2b3242;
  --accent:#fb923c; --accent-soft:#3a2416; --marquee:#0b0d13; --marquee-fg:#fff4e6; --bulb:#f5b544;
  --ok:#4ade80; --ok-soft:#14321f; --info:#93b4ff; --info-soft:#1c2a4a; --bad:#f87171; --bad-soft:#3b1a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2b; --fg:#e9ebf1; --muted:#9aa1b4; --line:#2b3242;
  --accent:#fb923c; --accent-soft:#3a2416; --marquee:#0b0d13; --marquee-fg:#fff4e6; --bulb:#f5b544;
  --ok:#4ade80; --ok-soft:#14321f; --info:#93b4ff; --info-soft:#1c2a4a; --bad:#f87171; --bad-soft:#3b1a1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.marquee{background:var(--marquee);color:var(--marquee-fg);position:relative}
header.marquee::before,header.marquee::after{content:"";position:absolute;left:0;right:0;height:6px;
  background:radial-gradient(circle,var(--bulb) 2px,transparent 2.6px) 0 50%/16px 6px repeat-x}
header.marquee::before{top:6px} header.marquee::after{bottom:6px}
header .wrap{padding-block:34px 30px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--bulb);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.lede{max-width:60ch;color:color-mix(in srgb,var(--marquee-fg) 80%,transparent);margin:6px 0 0}
section.block{padding-block:26px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.grid2 > *{min-width:0}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:15px var(--body);padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.az a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 15px var(--body);border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:#fff;cursor:pointer;align-self:flex-start}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{font-size:13px;padding:7px 14px}
.hint{font-size:13px;color:var(--muted);min-height:1.2em}
.hint.have{color:var(--ok);font-weight:600}
.notice{font-size:14px;background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 14px}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.req-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.req-title{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-new{background:var(--accent-soft);color:var(--accent)}
.s-working{background:var(--info-soft);color:var(--info)}
.s-ready{background:var(--ok-soft);color:var(--ok)}
.s-unavailable{background:var(--bad-soft);color:var(--bad)}
.reply{border-left:3px solid var(--line);padding-left:10px;font-size:14px}
.reply b{font-weight:600}
.edit{display:grid;grid-template-columns:150px 160px 1fr auto;gap:8px;align-items:end}
.edit > *{min-width:0}
@media (max-width:760px){.edit{grid-template-columns:1fr 1fr}.edit .wide{grid-column:1 / -1}}
.empty{color:var(--muted);padding:6px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{font:600 14px var(--body);border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tabs .n{font-weight:500;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
#q{flex:1 1 220px;min-width:0;border-radius:999px;background:var(--surface)}
.az{display:flex;flex-wrap:wrap;gap:2px;width:100%}
.az a{font:600 12px var(--body);color:var(--muted);text-decoration:none;padding:3px 6px;border-radius:4px}
.az a:hover{background:var(--accent-soft);color:var(--accent)}
.az a.off{opacity:.3;pointer-events:none}
#list{padding-block:18px 60px}
.group{display:grid;grid-template-columns:56px 1fr;gap:0 16px;padding-block:14px;border-top:1px solid var(--line);scroll-margin-top:130px}
.group:first-child{border-top:0}
.letter{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent)}
ul{list-style:none;margin:0;padding:0;columns:3 260px;column-gap:28px;min-width:0}
li{break-inside:avoid;padding:4px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
li .t{min-width:0}
li .y{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:520px){.group{grid-template-columns:1fr}.letter{font-size:30px;margin-bottom:4px}}
.admin-row{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.abtn{font:600 13px var(--body);text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:var(--bg)}
.abtn.done{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.abtn:hover{filter:brightness(1.08)}
.abtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pill.s-more{background:var(--info-soft);color:var(--info)}
.sug-wrap{position:relative;display:block}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:min(420px,60vh);overflow-y:auto;columns:auto}
.sug-item{display:flex;justify-content:flex-start;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;border:0;font-weight:400;color:var(--fg)}
.sug-item.active,.sug-item:hover{background:var(--accent-soft)}
.sug-img{flex:0 0 32px;width:32px;height:46px;border-radius:4px;background:var(--line);overflow:hidden}
.sug-img img{width:100%;height:100%;object-fit:cover;display:block}
.sug-txt{display:flex;flex-direction:column;min-width:0}
.sug-title{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.sug-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-tag{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.sug-tag.have{background:var(--ok-soft);color:var(--ok)}
.sug-tag.req{background:var(--info-soft);color:var(--info)}
.sug-foot{font-size:11px;color:var(--muted);padding:6px 8px 4px;border:0}
</style>
</head>
<body style="margin:0">
<header class="marquee"><div class="wrap">
  <div class="eyebrow">Box office · open</div>
  <h1>Family Movie Requests</h1>
  <p class="lede">Check <a href="./" style="color:var(--bulb)">the library</a> first. If what you want isn't there, ask for it here. Miguel gets an email, and the board below shows the status and ETA once he replies.</p>
</div></header>

<section class="block"><div class="wrap">
  <form class="panel" id="form" novalidate>
    <h2>Request a title</h2>
    <div class="grid2">
      <label for="f-title">Movie or show
        <span class="sug-wrap"><input id="f-title" required maxlength="140" placeholder="Start typing, e.g. Jaws" autocomplete="off" spellcheck="false"><ul id="f-sug" class="sug" role="listbox" aria-label="Title suggestions" hidden></ul></span>
      </label>
      <label for="f-kind">Type
        <select id="f-kind"><option value="Movie">Movie</option><option value="TV show">TV show</option></select>
      </label>
    </div>
    <div class="hint" id="f-hint"></div>
    <label for="f-note">Anything specific? (season, 4K, Spanish audio…)
      <textarea id="f-note" maxlength="500"></textarea>
    </label>
    <div class="grid2" style="grid-template-columns:1fr 1fr">
      <label for="f-name">Your name
        <input id="f-name" maxlength="60" autocomplete="name">
      </label>
      <label for="f-email">Your email (optional, for the ETA reply)
        <input id="f-email" type="email" maxlength="120" autocomplete="email">
      </label>
    </div>
    <button class="btn" id="f-send" type="submit">Send request</button>
    <div class="hint" id="f-status" role="status"></div>
  </form>
</div></section>

<section class="block"><div class="wrap" style="display:flex;flex-direction:column;gap:14px;padding-bottom:60px">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center">
    <h2>Request board</h2>
    <div class="filters" id="filters">
      <button type="button" class="chip" data-f="open" aria-pressed="true">Open</button>
      <button type="button" class="chip" data-f="all" aria-pressed="false">All</button>
    </div>
  </div>
  <div class="reqs" id="reqs"><p class="empty">Loading requests…</p></div>
</div></section>

/* live title search (IMDb suggestions) */
const sugBox=document.getElementById('f-sug'), fKind=document.getElementById('f-kind');
const TYPES={movie:'Movie',tvSeries:'TV series',tvMiniSeries:'TV mini-series',tvMovie:'TV movie',tvSpecial:'TV special',video:'Video'};
let sugItems=[], sugActive=-1, sugTimer=null, sugSeq=0;
function imdbJsonp(q){
  return new Promise((resolve,reject)=>{
    const key=q.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,'_').slice(0,20);
    if(!key) return resolve({d:[]});
    const cb='imdb$'+key, s=document.createElement('script');
    const done=v=>{ try{delete window[cb]}catch(e){window[cb]=undefined} s.remove(); clearTimeout(t); v?resolve(v):reject(); };
    const t=setTimeout(()=>done(null),6000);
    window[cb]=data=>done(data||{d:[]});
    s.onerror=()=>done(null);
    s.src='https://sg.media-imdb.com/suggests/'+key[0]+'/'+encodeURIComponent(key)+'.json';
    document.head.appendChild(s);
  });
}
async function imdbSearch(q){
  try{
    const r=await fetch('https://v3.sg.media-imdb.com/suggestion/x/'+encodeURIComponent(q.toLowerCase())+'.json');
    if(!r.ok) throw 0; return await r.json();
  }catch(e){ return imdbJsonp(q); }
}
function poster(u){ return u?u.replace(/\._V1_.*\.jpg$/,'._V1_UX64_.jpg'):''; }
function closeSug(){ sugBox.hidden=true; sugActive=-1; fTitle.setAttribute('aria-expanded','false'); fTitle.removeAttribute('aria-activedescendant'); }
function renderSug(){
  if(!sugItems.length){ closeSug(); return; }
  sugBox.innerHTML=sugItems.map((x,i)=>{
    const inLib=INDEX.some(e=>e.k===norm(x.l));
    const g=typeof findGroup==='function'?findGroup(x.l):null;
    const inSoon=!inLib&&SOON.some(e=>e.k===norm(x.l));
    const tag=inLib?'<span class="sug-tag have">In library</span>':inSoon?'<span class="sug-tag req">Coming soon</span>':g?'<span class="sug-tag req">Requested</span>':'';
    const img=poster(x.i&&(x.i.imageUrl||x.i[0]));
    return `<li role="option" id="sug-${i}" class="sug-item${i===sugActive?' active':''}" aria-selected="${i===sugActive}" data-i="${i}">
      <span class="sug-img">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:''}</span>
      <span class="sug-txt"><span class="sug-title">${esc(x.l)}${tag}</span>
      <span class="sug-meta">${esc([x.y,TYPES[x.qid]||x.q].filter(Boolean).join(' · '))}${x.s?' · '+esc(x.s):''}</span></span></li>`;
  }).join('')+'<li class="sug-foot" aria-hidden="true">Suggestions from IMDb · keep typing if you don’t see it</li>';
  sugBox.hidden=false; fTitle.setAttribute('aria-expanded','true');
  if(sugActive>=0) fTitle.setAttribute('aria-activedescendant','sug-'+sugActive); else fTitle.removeAttribute('aria-activedescendant');
}
function pickSug(i){
  const x=sugItems[i]; if(!x) return;
  fTitle.value=x.l+(x.y?' ('+x.y+')':'');
  fKind.value=/^tv(Series|MiniSeries)$/.test(x.qid)?'TV show':'Movie';
  closeSug(); fTitle.oninput(); fTitle.focus();
}
fTitle.setAttribute('role','combobox'); fTitle.setAttribute('aria-autocomplete','list');
fTitle.setAttribute('aria-controls','f-sug'); fTitle.setAttribute('aria-expanded','false');
fTitle.addEventListener('input',()=>{
  clearTimeout(sugTimer);
  const q=fTitle.value.trim();
  if(q.length<2){ sugItems=[]; closeSug(); return; }
  sugTimer=setTimeout(async()=>{
    const my=++sugSeq;
    let data; try{ data=await imdbSearch(q.replace(/\(\d{4}\)\s*$/,'').trim()); }catch(e){ data=null; }
    if(my!==sugSeq) return;
    sugItems=((data&&data.d)||[]).filter(x=>x.l&&TYPES[x.qid]).slice(0,7);
    sugActive=-1; renderSug();
  },220);
});
fTitle.addEventListener('keydown',e=>{
  if(sugBox.hidden||!sugItems.length) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); sugActive=(sugActive+1)%sugItems.length; renderSug(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sugActive=(sugActive-1+sugItems.length)%sugItems.length; renderSug(); }
  else if(e.key==='Enter'&&sugActive>=0){ e.preventDefault(); pickSug(sugActive); }
  else if(e.key==='Escape'){ closeSug(); }
});
sugBox.addEventListener('mousedown',e=>{ const li=e.target.closest('.sug-item'); if(li){ e.preventDefault(); pickSug(+li.dataset.i); } });

function namesText(g){const n=g.names; if(!n.length) return 'someone'; if(n.length===1) return n[0]; if(n.length===2) return n[0]+' and '+n[1]; return n.slice(0,-1).join(', ')+' and '+n[n.length-1];}

};

/* request board from the published sheet */
function parseCSV(s){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&s[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c; }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}
const STATUS_CLASS=(s,reply)=>{let x=(s||'').toLowerCase(); if(!x && /^\s*(done|ready|available)/i.test(reply||'')) return ['ready','Available now'];
  if(!x||x.includes('request')||x==='new') return ['new','Requested'];
  if(x.includes('avail')||x.includes('ready')||x.includes('done')) return ['ready',s];
  if(x.includes("can't")||x.includes('cant')||x.includes('not')||x.includes('unavail')) return ['unavailable',s];
  return ['working',s];};
function getOv(){try{return JSON.parse(localStorage.getItem('mr-ov')||'{}')}catch(e){return {}}}
function setOv(o){try{localStorage.setItem('mr-ov',JSON.stringify(o))}catch(e){}}
let board=[], groups=[], filter='open', loaded=false, loadErr=false;
/* one card per title: duplicates become "N people want this" */
function buildGroups(){
  const map=new Map();
  [...pending,...board].forEach(r=>{ const k=norm(r.title); if(!k) return;
    let g=map.get(k); if(!g){ g={key:k,rows:[],names:[],title:r.title,kind:r.kind,status:'',eta:'',reply:'',note:'',ts:r.ts,first:r.ts,local:true}; map.set(k,g); }
    g.rows.push(r); if(!r.local) g.local=false;
    if(r.name&&!g.names.some(n=>n.toLowerCase()===r.name.toLowerCase())) g.names.push(r.name);
    if(!g.status&&r.status) g.status=r.status; if(!g.eta&&r.eta) g.eta=r.eta; if(!g.reply&&r.reply) g.reply=r.reply;
    if(!g.note&&r.note&&!/^me too\.?$/i.test(r.note)) g.note=r.note.replace(/^me too\.\s*/i,'');
    if(!r.local){ g.title=r.title; g.kind=r.kind||g.kind; g.first=r.ts; }  /* rows are newest first, so this ends on the oldest */
  });
  groups=[...map.values()];
  groups.forEach(g=>{ g.names.reverse(); });
  const ov=getOv(), now=Date.now(); let changed=false;
  Object.keys(ov).forEach(k=>{ const g=groups.find(x=>x.key===k); const o=ov[k];
    if(!g || g.status===o.status || now-o.at>30*60*1000){ delete ov[k]; changed=true; } else g.status=o.status; });
  if(changed) setOv(ov);
}
function findGroup(title){ const k=norm(title); return k?groups.find(g=>g.key===k):null; }
async function load(){
  if(BOARD_CSV.startsWith('__')){loadErr=true;render();return;}
  try{
    const r=await fetch(BOARD_CSV+(BOARD_CSV.includes('?')?'&':'?')+'t='+Date.now());
    const rows=parseCSV(await r.text()).slice(1).filter(r=>r[2]);
    board=rows.map(r=>({ts:r[0],kind:r[1],title:r[2],note:r[3],name:r[4],status:r[5],eta:r[6],reply:r[7]})).reverse();
    pending=pending.filter(p=>!board.some(b=>norm(b.title)===norm(p.title)&&b.name===p.name));
    loaded=true; loadErr=false;
  }catch(e){loadErr=true;}
  render();
}
function render(){
  buildGroups();
  const el=document.getElementById('reqs');
  let items=groups;
  if(filter==='open') items=items.filter(x=>{const c=STATUS_CLASS(x.status,x.reply)[0];return c==='new'||c==='working';});
  if(!items.length){
    el.innerHTML=`<p class="empty">${loadErr?'The request board isn’t available right now. Requests still go through.':loaded?(filter==='open'?'No open requests right now.':'No requests yet.'):'Loading requests…'}</p>`;
    return;
  }
  el.innerHTML=items.map(x=>{
    const [cls,label]=STATUS_CLASS(x.status,x.reply);
    const when=x.first instanceof Date?'just now':esc(String(x.first).split(' ')[0]);
    const n=x.names.length>1?x.names.length:x.rows.length;
    return `<article class="req">
      <div class="req-top"><span class="req-title">${esc(x.title)}${/tv/i.test(x.kind)?' <span class="meta">· TV</span>':''}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${n>1?`<span class="pill s-more">${n} people want this</span>`:''}<span class="pill s-${cls}">${esc(label)}</span></span></div>
      <div class="meta">${x.names.length?esc(namesText(x))+' · ':''}First asked ${when}${x.eta?' · ETA '+esc(x.eta):''}</div>
      ${x.note?`<div class="meta">“${esc(x.note)}”</div>`:''}
      ${x.reply?`<div class="reply"><b>Miguel:</b> ${esc(x.reply)}</div>`:''}
      ${ADMIN&&!x.local?`<div class="admin-row">${[['Available now','✓ Mark done','done'],['Working on it','Working on it','work'],["Can't get it","Can't get it",'nope']].map(([st,lbl,c])=>`<a class="abtn ${c}" target="_blank" rel="noopener" data-st="${esc(st)}" data-key="${esc(x.key)}" href="${ADMIN_URL}?${new URLSearchParams({ts:x.rows.filter(r=>!r.local).slice(-1)[0].ts,title:x.title,status:st,all:'1'})}">${lbl}</a>`).join('')}</div>`:''}
    </article>`;
  }).join('');
}
document.querySelectorAll('#filters .chip').forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;document.querySelectorAll('#filters .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render();});
document.getElementById('reqs').addEventListener('click',e=>{
  const a=e.target.closest('.abtn'); if(!a) return;
  const g=groups.find(x=>x.key===a.dataset.key); if(!g) return;
  const ov=getOv(); ov[g.key]={status:a.dataset.st,at:Date.now()}; setOv(ov);
  toast(`“${g.title}” set to ${a.dataset.st}. Family will see it within about 5 minutes.`);
  setTimeout(render,50);
});
if(ADMIN){ const h=document.querySelector('#reqs').previousElementSibling.querySelector('h2'); if(h) h.textContent='Request board · admin'; }
function toast(msg){let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,5000);}
load(); setInterval(load,60000);
</script>
